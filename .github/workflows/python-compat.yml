name: Python Compatibility

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-type-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.14"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build
      - name: Lint
        run: |
          python -m black --check .
          python -m ruff check .
      - name: Type check
        run: python -m mypy mower_sdk
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Build
        run: python -m build

  compatibility-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and runtime dependencies
        run: python -m pip install .
      - name: Import installed package with real dependencies
        run: python -c "import mower_sdk; print(mower_sdk.__version__)"
      - name: Run compatibility regression tests
        run: python -m unittest discover -s tests -v

  arm-endpoints:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: ARM32
            python-version: "3.9.2"
            platform: linux/arm/v7
            image: python:3.9.2-slim@sha256:ce367bb30b8928efb632c369e3bd4a8dbd7905417bd0a245087a82c250e54a24
          - architecture: ARM32
            python-version: "3.14"
            platform: linux/arm/v7
            image: python:3.14-slim@sha256:cae66f2ef0ec51a9891263eeee7f987dacf0a9879e8aa9353d5606e0530619a5
          - architecture: ARM64
            python-version: "3.9.2"
            platform: linux/arm64
            image: python:3.9.2-slim@sha256:ce367bb30b8928efb632c369e3bd4a8dbd7905417bd0a245087a82c250e54a24
          - architecture: ARM64
            python-version: "3.14"
            platform: linux/arm64
            image: python:3.14-slim@sha256:cae66f2ef0ec51a9891263eeee7f987dacf0a9879e8aa9353d5606e0530619a5
    name: ${{ matrix.architecture }} / Python ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
        with:
          platforms: arm,arm64
      - name: Install and test under emulation
        run: |
          docker run --rm \
            --platform "${{ matrix.platform }}" \
            --volume "${{ github.workspace }}:/workspace" \
            --workdir /workspace \
            "${{ matrix.image }}" \
            sh -c "python -m pip install . && python -c 'import mower_sdk; print(mower_sdk.__version__)' && python -m unittest discover -s tests -v"
