name: Python Compatibility

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-type-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.14"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build
      - name: Lint
        run: |
          python -m black --check .
          python -m ruff check .
      - name: Type check
        run: python -m mypy mower_sdk
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Build
        run: python -m build

  compatibility-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and runtime dependencies
        run: python -m pip install .
      - name: Import installed package with real dependencies
        run: python -c "import mower_sdk; print(mower_sdk.__version__)"
      - name: Run compatibility regression tests
        run: python -m unittest discover -s tests -v

  arm-endpoints:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: ARM32
            platform: linux/arm/v7
            image: python:3.9.2-slim
          - architecture: ARM32
            platform: linux/arm/v7
            image: python:3.14-slim
          - architecture: ARM64
            platform: linux/arm64
            image: python:3.9.2-slim
          - architecture: ARM64
            platform: linux/arm64
            image: python:3.14-slim
    name: ${{ matrix.architecture }} / ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm,arm64
      - name: Install and test under emulation
        run: |
          docker run --rm \
            --platform "${{ matrix.platform }}" \
            --volume "${{ github.workspace }}:/workspace" \
            --workdir /workspace \
            "${{ matrix.image }}" \
            sh -c "python -m pip install . && python -c 'import mower_sdk; print(mower_sdk.__version__)' && python -m unittest discover -s tests -v"
